name: NFL Data Refresh and Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/nfl-data-refresh.yml"
      - "refresh_data.py"
      - "refresh_wr_data.py"
      - "refresh_qb_data.py"
      - "refresh_rb_data.py"
      - "refresh_oline_data.py"
      - "refresh_cb_data.py"
      - "refresh_edge_data.py"
      - "tests/**"
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nfl-pages
  # Do not cancel a refresh while it is committing its generated JSON files.
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    # A snapshot commit made by this workflow must not start a second,
    # overlapping refresh/deploy run.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: python -m unittest discover -s tests -v
      - name: Diagnose NFL Savant browser data requests
        continue-on-error: true
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python diagnose_savant_browser.py
      - name: Download and validate current 2026 team and WR data
        run: |
          python refresh_data.py
          python refresh_wr_data.py
          python refresh_qb_data.py
          python refresh_rb_data.py
          python refresh_oline_data.py
          python refresh_cb_data.py
          python refresh_edge_data.py
      - name: Commit refreshed JSON snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/teams_2026.json public/data/wr_players_2026.json public/data/qb_players_2026.json public/data/rb_players_2026.json public/data/oline_2026.json public/data/cb_players_2026.json public/data/edge_players_2026.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Update NFL 2026 team, WR, QB, RB, CB, edge and offensive line data snapshots"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
