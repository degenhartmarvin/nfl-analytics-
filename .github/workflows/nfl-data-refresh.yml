name: NFL Data Refresh and Pages Deploy
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/nfl-data-refresh.yml"
      - "refresh_data.py"
      - "refresh_wr_data.py"
      - "tests/**"
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: nfl-pages
  cancel-in-progress: true
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test pipeline
        run: python -m unittest discover -s tests -v
      - name: Download and validate current 2026 team and WR data
        run: |
          python refresh_data.py
          python refresh_wr_data.py
      - name: Commit refreshed JSON snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/teams_2026.json public/data/wr_players_2026.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
          else
            git commit -m "Update NFL 2026 team and WR data snapshots"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
